<title>Chandan's Kitchen Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&display=swap">
<style>
/* Layout: sticky header with language + day rail, meal sub-tabs, dish cards with ingredient list beside numbered steps */
:root{
  --bg:#F5F6F0; --surface:#FFFFFF; --fg:#1D231B; --muted:#5E6658; --line:#DDE1D4;
  --leaf:#3E6B38; --leaf-soft:#E3EDDC; --haldi:#B97A06; --haldi-soft:#FBF0D6; --chili:#B4432C;
  --display:"Bricolage Grotesque","Noto Sans Devanagari","Noto Sans Kannada",system-ui,sans-serif;
  --body:"Inter","Noto Sans Devanagari","Noto Sans Kannada",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131611; --surface:#1B1F18; --fg:#E7EBE1; --muted:#9BA393; --line:#2E3429;
  --leaf:#8FC283; --leaf-soft:#22301F; --haldi:#E3AD45; --haldi-soft:#2F2714; --chili:#E5826B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131611; --surface:#1B1F18; --fg:#E7EBE1; --muted:#9BA393; --line:#2E3429;
  --leaf:#8FC283; --leaf-soft:#22301F; --haldi:#E3AD45; --haldi-soft:#2F2714; --chili:#E5826B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,38px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.langs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;color:var(--fg);font:600 13px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--leaf);color:var(--bg)}
nav.days{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:12px 0 10px;scrollbar-width:none}
nav.days::-webkit-scrollbar{display:none}
nav.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--body);padding:8px 14px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:64px}
nav.days button small{font-weight:500;font-size:11px;color:var(--muted)}
nav.days button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
nav.days button[aria-selected="true"] small{color:var(--bg);opacity:.75}
nav.days .sep{width:1px;background:var(--line);flex:0 0 1px;margin:4px 2px}
button:focus-visible{outline:2px solid var(--haldi);outline-offset:2px}
.dayhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin:14px 0 4px}
.dayhead h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0}
.pill{font:600 12px var(--body);padding:3px 10px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf)}
.pill.self{background:var(--haldi-soft);color:var(--haldi)}
.meals{display:flex;gap:0;border-bottom:1px solid var(--line);margin:12px 0 18px;overflow-x:auto}
.meals button{border:0;background:transparent;color:var(--muted);font:600 15px var(--body);padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.meals button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--haldi)}
.mealtime{color:var(--muted);font-size:13px;margin:-8px 0 14px}
.dishes{display:grid;gap:14px}
.dish{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:8px 26px}
.dish h3{grid-column:1/-1;font-family:var(--display);font-weight:600;font-size:19px;margin:0;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.dish h3 .pro{font:600 12px var(--body);color:var(--leaf)}
.lbl{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 6px}
ul.ing{list-style:none;margin:0;padding:0}
ul.ing li{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
ul.ing li:last-child{border-bottom:0}
ul.ing .q{flex:0 0 74px;font-variant-numeric:tabular-nums;font-weight:600;color:var(--haldi)}
ol.steps{margin:0;padding-left:20px;font-size:14px;display:grid;gap:4px}
ol.steps li::marker{color:var(--leaf);font-weight:700}
.note{grid-column:1/-1;font-size:13px;color:var(--chili);margin:4px 0 0}
.sum h2{font-family:var(--display);font-weight:800;font-size:26px;margin:16px 0 10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.box h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 8px}
.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.t{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.t b{display:block;font-family:var(--display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.t span{font-size:12px;color:var(--muted)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--haldi);white-space:nowrap}
.printall section.dayblock{break-before:page;padding-top:8px}
.printall .mealblock h4{font-family:var(--display);font-size:18px;margin:16px 0 8px;color:var(--haldi)}
.shop{display:grid;gap:14px;margin-top:14px}
.shop .box h3{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.shop .box h3 small{font:500 12px var(--body);color:var(--muted)}
ul.chk{list-style:none;margin:0;padding:0;columns:2 260px;column-gap:28px}
ul.chk li{break-inside:avoid;border-bottom:1px dashed var(--line)}
ul.chk label{display:flex;gap:10px;align-items:baseline;padding:7px 0;cursor:pointer;font-size:14px}
ul.chk input{width:17px;height:17px;accent-color:var(--leaf);flex:0 0 auto;transform:translateY(3px)}
ul.chk .q{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;color:var(--haldi);white-space:nowrap;padding-left:8px}
ul.chk input:checked~span{text-decoration:line-through;color:var(--muted)}
.shopnotes{font-size:13px;color:var(--muted);margin:0;padding-left:18px;display:grid;gap:3px}
.clear{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 13px var(--body);padding:7px 12px;border-radius:8px;cursor:pointer}
@media (max-width:640px){.dish{grid-template-columns:1fr}}
@media print{nav.days,.langs,.meals{display:none!important}.dish,.box{break-inside:avoid}body{font-size:12px}}
</style>

 steps:[L("Take out of the fridge 30 min before. Add roasted jeera and a pinch of salt. No sugar.","30 min pehle fridge se nikaalo. Bhuna jeera, chutki namak. Cheeni nahi.","30 मिनट पहले फ्रिज से निकालें। भुना जीरा, चुटकी नमक। चीनी नहीं।","30 ನಿಮಿಷ ಮೊದಲು ಫ್ರಿಜ್‌ನಿಂದ ತೆಗೆಯಿರಿ. ಹುರಿದ ಜೀರಿಗೆ, ಚಿಟಿಕೆ ಉಪ್ಪು. ಸಕ್ಕರೆ ಬೇಡ.")]};
S.dal=(key,nm)=>({name:nm,pro:"~9 g",
 ing:[["40 g",I[key]],[q(U.pinch),I.haldi],["1 tsp",I.ghee],["½ tsp",I.jeera],["2",I.garlic],["½",I.lemon],[q(U.taste),I.salt]],
 steps:[L("Wash dal. Pressure cook with 1½ cups water, turmeric and salt, 3 whistles.","Dal dho ke 1½ cup paani, haldi, namak ke saath 3 seeti.","दाल धोकर 1½ कप पानी, हल्दी, नमक के साथ 3 सीटी।","ಬೇಳೆ ತೊಳೆದು 1½ ಕಪ್ ನೀರು, ಅರಿಶಿನ, ಉಪ್ಪು ಹಾಕಿ 3 ವಿಸಿಲ್."),
  L("Tadka: 1 tsp ghee, jeera, chopped garlic. Pour over dal.","Tadka: 1 tsp ghee, jeera, lehsun. Dal par daalo.","तड़का: 1 चम्मच घी, जीरा, लहसुन। दाल पर डालें।","ಒಗ್ಗರಣೆ: 1 ಚಮಚ ತುಪ್ಪ, ಜೀರಿಗೆ, ಬೆಳ್ಳುಳ್ಳಿ. ಬೇಳೆಗೆ ಹಾಕಿ."),
  L("Keep it medium thick. Squeeze ½ lemon over it just before serving.","Medium gaadha rakho. Dene se pehle ½ nimbu nichodo.","मध्यम गाढ़ी रखें। परोसने से पहले ½ नींबू निचोड़ें।","ಮಧ್ಯಮ ದಪ್ಪ ಇರಲಿ. ಕೊಡುವ ಮೊದಲು ½ ನಿಂಬೆ ಹಿಂಡಿ.")]});
S.palak={name:L("Palak sabzi","Palak sabzi","पालक सब्ज़ी","ಪಾಲಕ್ ಪಲ್ಯ"),pro:"~5 g",
 ing:[["200 g",I.palak],["3",I.garlic],["1 tsp",I.oil],["½",I.lemon],[q(U.taste),I.salt]],
 steps:[L("Wash well and chop.","Achhe se dho ke kaato.","अच्छे से धोकर काटें।","ಚೆನ್ನಾಗಿ ತೊಳೆದು ಕತ್ತರಿಸಿ."),
  L("Fry garlic in 1 tsp oil, add palak and salt.","1 tsp tel mein lehsun, phir palak aur namak.","1 चम्मच तेल में लहसुन, फिर पालक और नमक।","1 ಚಮಚ ಎಣ್ಣೆಯಲ್ಲಿ ಬೆಳ್ಳುಳ್ಳಿ, ನಂತರ ಪಾಲಕ್, ಉಪ್ಪು."),
  L("Cook 5 minutes without lid. Squeeze ½ lemon on top when serving.","Bina dhakkan 5 minute pakao. Dete waqt ½ nimbu nichodo.","बिना ढक्कन 5 मिनट पकाएं। परोसते समय ½ नींबू निचोड़ें।","ಮುಚ್ಚಳವಿಲ್ಲದೆ 5 ನಿಮಿಷ ಬೇಯಿಸಿ. ಕೊಡುವಾಗ ½ ನಿಂಬೆ ಹಿಂಡಿ.")]};
S.mixveg={name:L("Mixed veg sabzi","Mix veg sabzi","मिक्स वेज सब्ज़ी","ಮಿಶ್ರ ತರಕಾರಿ ಪಲ್ಯ"),pro:"~3 g",
 ing:[["150 g",I.veg],["1 tsp",I.oil],["½ tsp",I.jeera],[q(U.pinch),I.haldi],[q(U.taste),I.salt]],
 steps:[L("Chop veg small.","Sabzi chhoti kaato.","सब्ज़ी छोटी काटें।","ತರಕಾರಿ ಸಣ್ಣಗೆ ಕತ್ತರಿಸಿ."),
  L("Jeera in 1 tsp oil, add veg, turmeric, salt.","1 tsp tel mein jeera, phir sabzi, haldi, namak.","1 चम्मच तेल में जीरा, फिर सब्ज़ी, हल्दी, नमक।","1 ಚಮಚ ಎಣ್ಣೆಯಲ್ಲಿ ಜೀರಿಗೆ, ತರಕಾರಿ, ಅರಿಶಿನ, ಉಪ್ಪು."),
  L("Cover and cook 8 minutes, sprinkle water if needed.","Dhak ke 8 minute, zarurat ho to thoda paani.","ढककर 8 मिनट, ज़रूरत हो तो थोड़ा पानी।","ಮುಚ್ಚಿ 8 ನಿಮಿಷ, ಬೇಕಿದ್ದರೆ ಸ್ವಲ್ಪ ನೀರು.")]};
const MASALA_STEPS=[L("Heat 1 tsp oil. Fry chopped onion till golden.","1 tsp tel garam karo. Pyaaz golden hone tak bhuno.","1 चम्मच तेल गरम करें। प्याज़ सुनहरा होने तक भूनें।","1 ಚಮಚ ಎಣ್ಣೆ ಕಾಯಿಸಿ. ಈರುಳ್ಳಿ ಹೊಂಬಣ್ಣ ಬರುವವರೆಗೆ ಹುರಿಯಿರಿ."),
  L("Add ginger-garlic paste, then tomato and masala. Cook till oil separates.","Adrak-lehsun paste, phir tamatar aur masala. Tel chhodne tak pakao.","अदरक-लहसुन पेस्ट, फिर टमाटर और मसाला। तेल छोड़ने तक पकाएं।","ಶುಂಠಿ-ಬೆಳ್ಳುಳ್ಳಿ ಪೇಸ್ಟ್, ನಂತರ ಟೊಮೆಟೊ, ಮಸಾಲೆ. ಎಣ್ಣೆ ಬಿಡುವವರೆಗೆ ಬೇಯಿಸಿ.")];
const MASALA_ING=[["1",I.onion],["1",I.tomato],["1 tsp",I.gg],["1 tsp",I.oil],[q(U.taste),I.masala]];
S.tawaChicken={name:L("Tawa chicken","Tawa chicken","तवा चिकन","ತವಾ ಚಿಕನ್"),pro:"~33 g",
 ing:[["150 g",I.chicken],["1 tsp",I.gg],["1",I.lemon],[q(U.pinch),I.haldi],[q(U.taste),I.masala],["1 tsp",I.oil]],
 steps:[L("Cut chicken into thin strips or flatten the pieces.","Chicken ko patli strips mein kaato ya pieces chapte karo.","चिकन को पतली पट्टियों में काटें या टुकड़े चपटे करें।","ಚಿಕನ್ ಅನ್ನು ತೆಳು ಪಟ್ಟಿಗಳಾಗಿ ಕತ್ತರಿಸಿ ಅಥವಾ ಚಪ್ಪಟೆ ಮಾಡಿ."),
  L("Mix with lemon juice, ginger-garlic paste, turmeric, masala. No curd. Rest 20 min.","Nimbu ras, adrak-lehsun paste, haldi, masala mein milao. Dahi nahi. 20 min rakho.","नींबू रस, अदरक-लहसुन पेस्ट, हल्दी, मसाला में मिलाएं। दही नहीं। 20 मिनट रखें।","ನಿಂಬೆ ರಸ, ಶುಂಠಿ-ಬೆಳ್ಳುಳ್ಳಿ ಪೇಸ್ಟ್, ಅರಿಶಿನ, ಮಸಾಲೆ ಜೊತೆ ಕಲಸಿ. ಮೊಸರು ಬೇಡ. 20 ನಿಮಿಷ ಇಡಿ."),
  L("Tawa + 1 tsp oil, medium flame, 5–6 min each side till fully cooked.","Tawa + 1 tsp tel, medium aanch, har side 5–6 min, poora pakne tak.","तवा + 1 चम्मच तेल, मध्यम आंच, हर तरफ 5–6 मिनट, पूरा पकने तक।","ತವಾ + 1 ಚಮಚ ಎಣ್ಣೆ, ಮಧ್ಯಮ ಉರಿ, ಪ್ರತಿ ಬದಿ 5–6 ನಿಮಿಷ, ಪೂರ್ತಿ ಬೇಯುವವರೆಗೆ.")]};
S.soyaCurry=(nm)=>({name:nm,pro:"~26 g",
 ing:[["50 g",I.soya],...MASALA_ING,["½ cup",I.water]],
 steps:[L("Boil soya chunks in water 5 min. Rinse and squeeze dry.","Soya ko 5 min paani mein ubaalo. Dho ke nichod lo.","सोया को 5 मिनट उबालें। धोकर निचोड़ लें।","ಸೋಯಾವನ್ನು 5 ನಿಮಿಷ ಕುದಿಸಿ. ತೊಳೆದು ಹಿಂಡಿ."),...MASALA_STEPS,
  L("Add soya and ½ cup water. Cook 8 min.","Soya aur ½ cup paani daalo. 8 min pakao.","सोया और ½ कप पानी डालें। 8 मिनट पकाएं।","ಸೋಯಾ ಮತ್ತು ½ ಕಪ್ ನೀರು ಹಾಕಿ. 8 ನಿಮಿಷ ಬೇಯಿಸಿ.")]});
S.toast={name:L("Toast × 2","Toast × 2","टोस्ट × 2","ಟೋಸ್ಟ್ × 2"),ing:[["2 slices",I.bread]],

const OMLET_STEPS=extra=>[L("Beat 3 eggs + 2 extra whites with salt.","3 ande + 2 safedi namak ke saath phento.","3 अंडे + 2 सफेदी नमक के साथ फेंटें।","3 ಮೊಟ್ಟೆ + 2 ಬಿಳಿಭಾಗ ಉಪ್ಪಿನೊಂದಿಗೆ ಕಲಕಿ."),
  extra,
  L("Pour eggs on the pan, cook both sides on medium.","Ande pan mein daalo, dono taraf medium aanch par pakao.","अंडे पैन में डालें, दोनों तरफ मध्यम आंच पर पकाएं।","ಮೊಟ್ಟೆಯನ್ನು ಪ್ಯಾನ್‌ಗೆ ಹಾಕಿ, ಎರಡೂ ಬದಿ ಮಧ್ಯಮ ಉರಿಯಲ್ಲಿ ಬೇಯಿಸಿ.")];
S.spinachOmelette={name:L("Spinach omelette","Palak omelette","पालक ऑमलेट","ಪಾಲಕ್ ಆಮ್ಲೆಟ್"),pro:"~25 g",

S.masalaOmelette={name:L("Masala omelette","Masala omelette","मसाला ऑमलेट","ಮಸಾಲಾ ಆಮ್ಲೆಟ್"),pro:"~25 g",

S.besanChilla={name:L("Besan chilla with paneer (× 2)","Besan chilla paneer wala (× 2)","पनीर वाला बेसन चीला (× 2)","ಪನೀರ್ ಬೇಸನ್ ಚಿಲ್ಲಾ (× 2)"),pro:"~18 g",

 steps:[L("Mix besan, salt, ajwain and water into a pouring batter. Add chopped onion, tomato, coriander.","Besan, namak, ajwain, paani ka patla ghol. Pyaaz, tamatar, dhaniya daalo.","बेसन, नमक, अजवाइन, पानी का पतला घोल। प्याज़, टमाटर, धनिया डालें।","ಕಡಲೆ ಹಿಟ್ಟು, ಉಪ್ಪು, ಓಂಕಾಳು, ನೀರಿನಿಂದ ತೆಳು ಹಿಟ್ಟು. ಈರುಳ್ಳಿ, ಟೊಮೆಟೊ, ಕೊತ್ತಂಬರಿ ಸೇರಿಸಿ."),
  L("Spread 2 thin chillas on tawa with a few drops of oil each.","Tawe par 2 patle chille, har ek par kuch boond tel.","तवे पर 2 पतले चीले, हर एक पर कुछ बूंद तेल।","ತವಾದಲ್ಲಿ 2 ತೆಳು ಚಿಲ್ಲಾ, ಪ್ರತಿಯೊಂದಕ್ಕೆ ಕೆಲವು ಹನಿ ಎಣ್ಣೆ."),
  L("Put grated paneer inside, fold and serve.","Andar kaddukas paneer bharo, mod ke do.","अंदर कद्दूकस पनीर भरें, मोड़कर परोसें।","ಒಳಗೆ ತುರಿದ ಪನೀರ್ ಹಾಕಿ ಮಡಚಿ ಕೊಡಿ.")]};
S.eggBhurji={name:L("Egg bhurji","Egg bhurji","अंडा भुर्जी","ಮೊಟ್ಟೆ ಬುರ್ಜಿ"),pro:"~18 g",

S.ragiRoti={name:L("Ragi roti × 2","Ragi roti × 2","रागी रोटी × 2","ರಾಗಿ ರೊಟ್ಟಿ × 2"),pro:"~4 g",

  L("Roll 2 rotis, cook on tawa without ghee.","2 roti belo, bina ghee tawe par seko.","2 रोटी बेलें, बिना घी तवे पर सेकें।","2 ರೊಟ್ಟಿ ಲಟ್ಟಿಸಿ, ತುಪ್ಪವಿಲ್ಲದೆ ತವಾದಲ್ಲಿ ಬೇಯಿಸಿ.")]};
S.poha={name:L("Veg poha with peanuts","Poha moongphali wala","मूंगफली वाला पोहा","ಕಡಲೆಕಾಯಿ ಅವಲಕ್ಕಿ ಒಗ್ಗರಣೆ"),pro:"~8 g",

 steps:[L("Rinse poha in a strainer, let it drain.","Poha chhalni mein dho ke paani nikalne do.","पोहा छलनी में धोकर पानी निकलने दें।","ಅವಲಕ್ಕಿಯನ್ನು ಜರಡಿಯಲ್ಲಿ ತೊಳೆದು ನೀರು ಬಸಿಯಲು ಬಿಡಿ."),
  L("Dry-roast peanuts, keep aside.","Moongphali bina tel bhuno, alag rakho.","मूंगफली बिना तेल भूनें, अलग रखें।","ಕಡಲೆಕಾಯಿ ಎಣ್ಣೆಯಿಲ್ಲದೆ ಹುರಿದು ಪಕ್ಕಕ್ಕಿಡಿ."),
  L("1 tsp oil: mustard, curry leaves, onion, peas.","1 tsp tel: rai, kadi patta, pyaaz, matar.","1 चम्मच तेल: राई, कड़ी पत्ता, प्याज़, मटर।","1 ಚಮಚ ಎಣ್ಣೆ: ಸಾಸಿವೆ, ಕರಿಬೇವು, ಈರುಳ್ಳಿ, ಬಟಾಣಿ."),
  L("Add poha, turmeric, salt, peanuts. Mix 2 min, squeeze lemon.","Poha, haldi, namak, moongphali daalo. 2 min milao, nimbu nichodo.","पोहा, हल्दी, नमक, मूंगफली डालें। 2 मिनट मिलाएं, नींबू निचोड़ें।","ಅವಲಕ್ಕಿ, ಅರಿಶಿನ, ಉಪ್ಪು, ಕಡಲೆಕಾಯಿ ಹಾಕಿ. 2 ನಿಮಿಷ ಕಲಸಿ, ನಿಂಬೆ ಹಿಂಡಿ.")]};

  L("Spread 2 thin chillas, few drops of oil each.","2 patle chille, har ek par kuch boond tel.","2 पतले चीले, हर एक पर कुछ बूंद तेल।","2 ತೆಳು ಚಿಲ್ಲಾ, ಪ್ರತಿಯೊಂದಕ್ಕೆ ಕೆಲವು ಹನಿ ಎಣ್ಣೆ.")]};
S.oats={name:L("Overnight oats","Overnight oats","ओवरनाइट ओट्स","ಓವರ್‌ನೈಟ್ ಓಟ್ಸ್"),pro:"~35 g",
 ing:[["40 g",I.oats],[q(U.scoop),I.whey],["150 g",I.curd],["50 ml",I.water],["10 g",I.seeds],["1",I.banana]],
 steps:[L("Saturday night: mix oats, whey, curd, water and seeds in a jar.","Shanivaar raat: jar mein oats, whey, dahi, paani, seeds milao.","शनिवार रात: जार में ओट्स, व्हे, दही, पानी, बीज मिलाएं।","ಶನಿವಾರ ರಾತ್ರಿ: ಜಾರ್‌ನಲ್ಲಿ ಓಟ್ಸ್, ವೇ, ಮೊಸರು, ನೀರು, ಬೀಜ ಬೆರೆಸಿ."),
  L("Close and keep in the fridge.","Band karke fridge mein rakho.","बंद करके फ्रिज में रखें।","ಮುಚ್ಚಿ ಫ್ರಿಜ್‌ನಲ್ಲಿ ಇಡಿ."),
  L("Morning: top with chopped banana, eat cold.","Subah: kela kaat ke upar daalo, thanda khao.","सुबह: केला काटकर ऊपर डालें, ठंडा खाएं।","ಬೆಳಿಗ್ಗೆ: ಬಾಳೆಹಣ್ಣು ಕತ್ತರಿಸಿ ಮೇಲೆ ಹಾಕಿ, ತಣ್ಣಗೆ ತಿನ್ನಿ.")]};
S.palakPaneer={name:L("Palak paneer","Palak paneer","पालक पनीर","ಪಾಲಕ್ ಪನೀರ್"),pro:"~22 g",
 ing:[["200 g",I.palak],["100 g",I.paneer],...MASALA_ING],

  L("Add palak puree, cook 3 min, then paneer cubes 3 min. No cream or butter.","Palak puree daal ke 3 min, phir paneer 3 min. Cream ya makhan nahi.","पालक प्यूरी डालकर 3 मिनट, फिर पनीर 3 मिनट। क्रीम या मक्खन नहीं।","ಪಾಲಕ್ ಪ್ಯೂರಿ ಹಾಕಿ 3 ನಿಮಿಷ, ನಂತರ ಪನೀರ್ 3 ನಿಮಿಷ. ಕ್ರೀಮ್, ಬೆಣ್ಣೆ ಬೇಡ.")]};
S.rajma={name:L("Rajma","Rajma","राजमा","ರಾಜ್ಮಾ"),pro:"~12 g",
 ing:[["50 g",I.rajma],...MASALA_ING],

  L("Pressure cook with salt, 6–7 whistles till soft.","Namak ke saath 6–7 seeti, naram hone tak.","नमक के साथ 6–7 सीटी, नरम होने तक।","ಉಪ್ಪಿನೊಂದಿಗೆ 6–7 ವಿಸಿಲ್, ಮೆತ್ತಗಾಗುವವರೆಗೆ."),...MASALA_STEPS,
  L("Add rajma with its water, simmer 10 min.","Rajma paani samet daalo, 10 min dheemi aanch.","राजमा पानी समेत डालें, 10 मिनट धीमी आंच।","ರಾಜ್ಮಾ ನೀರಿನೊಂದಿಗೆ ಹಾಕಿ, 10 ನಿಮಿಷ ಸಣ್ಣ ಉರಿ.")]};
S.lobia={name:L("Lobia","Lobia","लोबिया","ಅಲಸಂದೆ ಸಾರು"),pro:"~12 g",

  L("Pressure cook with salt, 4 whistles.","Namak ke saath 4 seeti.","नमक के साथ 4 सीटी।","ಉಪ್ಪಿನೊಂದಿಗೆ 4 ವಿಸಿಲ್."),...MASALA_STEPS,

S.paneerSabzi={name:L("Paneer sabzi (capsicum & peas)","Paneer shimla-matar sabzi","पनीर शिमला-मटर सब्ज़ी","ಪನೀರ್ ದೊಣ್ಣೆಮೆಣಸು-ಬಟಾಣಿ ಪಲ್ಯ"),pro:"~22 g",

S.carrotBeet={name:L("Carrot-beet salad","Gajar-chukandar salad","गाजर-चुकंदर सलाद","ಕ್ಯಾರೆಟ್-ಬೀಟ್‌ರೂಟ್ ಸಲಾಡ್"),

S.raita={name:L("Cucumber raita","Kheera raita","खीरा रायता","ಸೌತೆಕಾಯಿ ರಾಯಿತ"),pro:"~5 g",

S.khichdi={name:L("Dal khichdi with paneer","Paneer wali dal khichdi","पनीर वाली दाल खिचड़ी","ಪನೀರ್ ಹೆಸರುಬೇಳೆ ಕಿಚಡಿ"),pro:"~28 g",

  L("In the cooker: 1 tsp oil, jeera, chopped veg for 1 min.","Cooker mein: 1 tsp tel, jeera, sabzi 1 min.","कुकर में: 1 चम्मच तेल, जीरा, सब्ज़ी 1 मिनट।","ಕುಕ್ಕರ್‌ನಲ್ಲಿ: 1 ಚಮಚ ಎಣ್ಣೆ, ಜೀರಿಗೆ, ತರಕಾರಿ 1 ನಿಮಿಷ."),

  L("Open, stir in paneer cubes. Eat with curd.","Kholo, paneer ke tukde milao. Dahi ke saath khao.","खोलें, पनीर के टुकड़े मिलाएं। दही के साथ खाएं।","ತೆರೆದು ಪನೀರ್ ತುಂಡು ಬೆರೆಸಿ. ಮೊಸರಿನೊಂದಿಗೆ ತಿನ್ನಿ.")]};
S.tikka=()=>({name:L("Tawa tofu tikka","Tawa tofu tikka","तवा टोफू टिक्का","ತವಾ ಟೋಫು ಟಿಕ್ಕಾ"),pro:"~24 g",

  L("Tawa + 1 tsp oil, cook 3–4 min each side with capsicum and onion pieces.","Tawa + 1 tsp tel, shimla mirch-pyaaz ke saath har side 3–4 min.","तवा + 1 चम्मच तेल, शिमला मिर्च-प्याज़ के साथ हर तरफ 3–4 मिनट।","ತವಾ + 1 ಚಮಚ ಎಣ್ಣೆ, ದೊಣ್ಣೆಮೆಣಸು-ಈರುಳ್ಳಿ ಜೊತೆ ಪ್ರತಿ ಬದಿ 3–4 ನಿಮಿಷ.")]});

 <li>5 min warm-up: light cardio, then 1–2 light sets of the first lift.</li>
 <li>Lift for 40–45 min, as listed below.</li><li>Finish with 10 min incline walking.</li>
 <li>Hit the top of the rep range on every set? Add 2.5 kg next time.</li>
 <li><b>Weeks 1–2:</b> only Mon, Tue, Wed and Fri, with 2 sets per exercise. All 6 days with 3 sets from week 3.</li>
 <li>Missed a day? Do the next session in order the following day. Never double up.</li>
 <li>Keep 2 reps in reserve on every set for the first 3 weeks.</li></ul></div></div>
 <h2>Workouts</h2><div class="grid2">${wo}</div>
 <h2>Saturday run: 8-week build-up</h2><div class="box">${run}</div>
 <h2>Protected time</h2><div class="box"><ul class="steps" style="padding-left:18px;margin:0;display:grid;gap:4px">
 <li>3:45–4:20 is for family, before the gym, so it never gets skipped.</li>
 <li>9:00–10:15 pm is yours. No laptop, even if a meeting ran late.</li>
 <li>9:45–10:15: phone down, to wind off YouTube before bed.</li>
 <li>Saturday and Sunday afternoons are fully free.</li>
 <li>Side projects and DSA only in the home-day morning slot, and only if you feel like it.</li></ul></div></div>`;
}
/* ---------- rendering ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let state={day:"mon",meal:"B"};
try{const s=JSON.parse(localStorage.getItem("kp-state")||"null");if(s)state=s}catch(e){}
const PRINT=/^#print-(en|hl|hi|kn)$/.exec(location.hash);
if(PRINT){lang=PRINT[1];state.day="all"}

function dishHTML(d){
  const ing=d.ing.length?`<div><div class="lbl">${esc(t(TXT.ing))}</div><ul class="ing">${d.ing.map(([qt,it])=>`<li><span class="q">${esc(t(qt))}</span><span>${esc(t(it))}</span></li>`).join("")}</ul></div>`:"<div></div>";
  return `<article class="dish"><h3>${esc(t(d.name))}${d.pro?`<span class="pro">${esc(d.pro)} ${esc(t(TXT.protein))}</span>`:""}</h3>${ing}
  <div><div class="lbl">${esc(t(TXT.steps))}</div><ol class="steps">${d.steps.map(s=>`<li>${esc(t(s))}</li>`).join("")}</ol></div></article>`;
}
function dayHead(d){return `<div class="dayhead"><h2>${esc(t(d.n))}</h2><span class="pill ${d.cook?"":"self"}">${esc(t(d.cook?TXT.cookDay:TXT.selfDay))}</span></div>`}
function dayView(d){
  return dayHead(d)+`<div class="meals" role="tablist">${MEALS.map(([k,n])=>`<button role="tab" aria-selected="${state.meal===k}" data-meal="${k}">${esc(t(n))}</button>`).join("")}</div>
  <p class="mealtime">${esc(t(MEALS.find(m=>m[0]===state.meal)[2]))}</p><div class="dishes">${d[state.meal].map(dishHTML).join("")}</div>`;
}
function dailyView(){return `<div class="dayhead"><h2>${esc(t(TXT.dailyH))}</h2></div><div class="dishes" style="margin-top:14px">${DAILY.map(dishHTML).join("")}</div>`}
function summaryView(){
  const glance=`<div class="tblwrap"><table><thead><tr><th></th>${MEALS.map(m=>`<th>${esc(t(m[1]))}</th>`).join("")}</tr></thead><tbody>${DAYS.map(d=>`<tr><td><b>${esc(t(d.s))}</b></td>${MEALS.map(([k])=>`<td>${d[k].map(x=>esc(t(x.name))).join(", ")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return `<div class="sum"><h2>${esc(t(TXT.targets))}</h2>
  <div class="targets"><div class="t"><b>~2,100</b><span>${esc(t(TXT.kcal))}</span></div><div class="t"><b>130–145</b><span>${esc(t(TXT.pro))}</span></div><div class="t"><b>3</b><span>${esc(t(TXT.oil))}</span></div><div class="t"><b>30+</b><span>${esc(t(TXT.fib))}</span></div><div class="t"><b>10,000</b><span>${esc(t(TXT.steps10))}</span></div></div>
  <div class="box" style="margin-bottom:14px"><h3>${esc(t(TXT.weekGlance))}</h3>${glance}</div>
  <div class="grid2"><div class="box"><h3>${esc(t(TXT.grocery))}</h3><div class="tblwrap"><table><thead><tr><th>${esc(t(TXT.item))}</th><th>${esc(t(TXT.qty))}</th></tr></thead><tbody>${GROCERY.map(([a,b])=>`<tr><td>${esc(t(a))}</td><td class="num">${esc(t(b))}</td></tr>`).join("")}</tbody></table></div></div>
  <div style="display:grid;gap:14px;align-content:start"><div class="box"><h3>${esc(t(TXT.prep))}</h3><ol class="steps">${PREP.map(p=>`<li>${esc(t(p))}</li>`).join("")}</ol></div>
  <div class="box"><h3>${esc(t(TXT.rules))}</h3><ul class="steps" style="padding-left:18px;margin:0;display:grid;gap:4px">${RULES.map(p=>`<li>${esc(t(p))}</li>`).join("")}</ul></div></div></div></div>`;
}
function allView(){
  return `<div class="printall">${DAYS.map(d=>`<section class="dayblock">${dayHead(d)}${MEALS.map(([k,n,tm])=>`<div class="mealblock"><h4>${esc(t(n))} · <span style="font-weight:400;font-size:14px;color:var(--muted)">${esc(t(tm))}</span></h4><div class="dishes">${d[k].map(dishHTML).join("")}</div></div>`).join("")}</section>`).join("")}
  <section class="dayblock">${dailyView()}</section><section class="dayblock">${summaryView()}</section>${lang==="en"?`<section class="dayblock">${routineView()}</section>`:""}<section class="dayblock">${shopView("sun")}</section><section class="dayblock">${shopView("wed")}</section></div>`;
}
function render(){
  document.documentElement.lang=lang==="hl"?"hi-Latn":lang;
  const tabs=[...DAYS.map(d=>[d.id,t(d.s),""]),["sep"],["daily",t(TXT.daily),t(TXT.dailyS)],["summary",t(TXT.summary),t(TXT.summaryS)],["routine",t(L("Routine","Routine","दिनचर्या","ದಿನಚರಿ")),t(L("you","aap","आप","ನೀವು"))],["sun-shop",t(SHOP.sun.tab),t(L("Mon–Wed","Som–Budh","सोम–बुध","ಸೋಮ–ಬುಧ"))],["wed-shop",t(SHOP.wed.tab),t(L("Thu–Sun","Guru–Ravi","गुरु–रवि","ಗುರು–ಭಾನು"))],["all",t(TXT.all),t(TXT.allS)]];
  const day=DAYS.find(d=>d.id===state.day);
  const body=day?dayView(day):state.day==="daily"?dailyView():state.day==="summary"?summaryView():state.day==="routine"?routineView():state.day==="sun-shop"?shopView("sun"):state.day==="wed-shop"?shopView("wed"):allView();
  document.getElementById("app").innerHTML=`
  <header class="top"><div><h1>Chandan's Kitchen Plan</h1><p class="sub">${esc(t(TXT.sub))}</p></div>
  ${PRINT?"":`<div class="langs" role="group" aria-label="Language">${LANGS.map(([k,n])=>`<button data-lang="${k}" aria-pressed="${lang===k}">${n}</button>`).join("")}</div>`}</header>
  ${PRINT?"":`<nav class="days" role="tablist">${tabs.map(x=>x[0]==="sep"?`<span class="sep"></span>`:`<button role="tab" data-day="${x[0]}" aria-selected="${state.day===x[0]}">${esc(x[1])}${!DAYS.find(d=>d.id===x[0])?`<small>${esc(x[2])}</small>`:`<small>${esc(t(DAYS.find(d=>d.id===x[0]).cook?TXT.cookDay:TXT.selfDay).split("·")[0].trim())}</small>`}</button>`).join("")}</nav>`}
  ${body}`;
  try{localStorage.setItem("kp-state",JSON.stringify(state));localStorage.setItem("kp-lang",lang)}catch(e){}
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.lang){lang=b.dataset.lang;render()}
  else if(b.dataset.day){state.day=b.dataset.day;render()}
  else if(b.dataset.meal){state.meal=b.dataset.meal;render()}
  else if(b.dataset.clear){Object.keys(ticks).forEach(k=>{if(k.startsWith("chk-"+b.dataset.clear))delete ticks[k]});try{localStorage.setItem("kp-ticks",JSON.stringify(ticks))}catch(e){}render()}
});
document.addEventListener("change",e=>{const c=e.target.closest("[data-tick]");if(!c)return;if(c.checked)ticks[c.dataset.tick]=1;else delete ticks[c.dataset.tick];try{localStorage.setItem("kp-ticks",JSON.stringify(ticks))}catch(e){}});
render();
</script>
